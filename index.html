<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayoub Mnina — Portfolio</title>

    <meta name="description"
          content="Hello ! My name is Ayoub MNINA, my website currently being rebuilt.">

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background: #f8f8fb;
            color: #20212a;

            min-height: 100vh;
            overflow: hidden;
        }


        /* =========================
           MAIN
        ========================= */

        .maintenance-page {
            min-height: 100vh;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 24px;

            overflow: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .gradient {
            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(124, 92, 255, 0.10) 0%,
                rgba(124, 92, 255, 0.04) 35%,
                transparent 70%
            );

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }


        /* =========================
           SCIENTIFIC ORBIT
        ========================= */

        .visual {
            position: absolute;

            width: 520px;
            height: 520px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            opacity: 0.65;
        }

        .orbit {
            position: absolute;

            top: 50%;
            left: 50%;

            border: 1px solid rgba(124, 92, 255, 0.12);

            border-radius: 50%;

            transform: translate(-50%, -50%) rotate(-20deg);
        }

        .orbit-1 {
            width: 320px;
            height: 120px;
        }

        .orbit-2 {
            width: 380px;
            height: 160px;

            transform: translate(-50%, -50%) rotate(55deg);
        }

        .orbit-3 {
            width: 440px;
            height: 200px;

            transform: translate(-50%, -50%) rotate(-55deg);
        }

        .center-point {
            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #7c5cff;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            box-shadow:
                0 0 0 8px rgba(124, 92, 255, 0.08),
                0 0 30px rgba(124, 92, 255, 0.25);
        }

        .node {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #7c5cff;

            opacity: 0.55;
        }

        .node-1 {
            top: 30%;
            left: 24%;
        }

        .node-2 {
            top: 24%;
            right: 23%;
        }

        .node-3 {
            bottom: 27%;
            left: 18%;
        }

        .node-4 {
            bottom: 20%;
            right: 25%;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 720px;

            text-align: center;
        }


        /* =========================
           EYEBROW
        ========================= */

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 28px;

            color: #77798a;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #7c5cff;

            box-shadow: 0 0 0 5px rgba(124, 92, 255, 0.08);
        }


        /* =========================
           NAME
        ========================= */

        h1 {
            font-size: clamp(52px, 8vw, 88px);

            line-height: 0.95;

            font-weight: 650;

            letter-spacing: -4px;

            color: #20212a;

            margin-bottom: 22px;
        }


        /* =========================
           ROLE
        ========================= */

        .role {
            font-size: 17px;

            color: #666979;

            font-weight: 400;

            margin-bottom: 48px;
        }

        .role span {
            margin: 0 8px;

            color: #b2b3bd;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            max-width: 560px;

            margin: 0 auto;
        }

        .message h2 {
            font-size: clamp(25px, 4vw, 34px);

            line-height: 1.2;

            font-weight: 500;

            letter-spacing: -1px;

            margin-bottom: 18px;

            color: #2c2d37;
        }

        .message p {
            font-size: 15px;

            line-height: 1.8;

            color: #77798a;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-top: 34px;

            padding: 10px 16px;

            border: 1px solid rgba(124, 92, 255, 0.12);

            border-radius: 100px;

            background: rgba(255, 255, 255, 0.65);

            color: #696b7b;

            font-size: 12px;
            font-weight: 500;

            backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #7c5cff;

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.35);
            }

            70% {
                box-shadow: 0 0 0 7px rgba(124, 92, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(124, 92, 255, 0);
            }
        }


        /* =========================
           SOCIAL LINKS
        ========================= */

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;

            margin-top: 42px;
        }

        .links a {
            position: relative;

            color: #555766;

            text-decoration: none;

            font-size: 13px;
            font-weight: 500;

            transition: color 0.2s ease;
        }

        .links a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -5px;

            width: 0;
            height: 1px;

            background: #7c5cff;

            transition: width 0.2s ease;
        }

        .links a:hover {
            color: #7c5cff;
        }

        .links a:hover::after {
            width: 100%;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: absolute;

            bottom: 28px;
            left: 0;
            right: 0;

            text-align: center;

            color: #a0a1ae;

            font-size: 11px;

            letter-spacing: 0.5px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            body {
                overflow: hidden;
            }

            .maintenance-page {
                padding: 30px 20px 70px;
            }

            .visual {
                width: 380px;
                height: 380px;

                opacity: 0.45;
            }

            .orbit-1 {
                width: 250px;
                height: 100px;
            }

            .orbit-2 {
                width: 300px;
                height: 130px;
            }

            .orbit-3 {
                width: 350px;
                height: 160px;
            }

            h1 {
                letter-spacing: -2.5px;
            }

            .role {
                font-size: 15px;
                margin-bottom: 38px;
            }

            .message h2 {
                font-size: 26px;
            }

            .message p {
                font-size: 14px;
                line-height: 1.7;
            }

            .links {
                gap: 22px;
            }

            .footer {
                bottom: 20px;
            }
        }

    </style>
</head>


<body>

    <main class="maintenance-page">

        <!-- Background -->
        <div class="background">
            <div class="gradient"></div>

            <div class="visual">
                <div class="orbit orbit-1"></div>
                <div class="orbit orbit-2"></div>
                <div class="orbit orbit-3"></div>

                <div class="center-point"></div>

                <div class="node node-1"></div>
                <div class="node node-2"></div>
                <div class="node node-3"></div>
                <div class="node node-4"></div>
            </div>
        </div>


        <!-- Main content -->
        <div class="content">

            <div class="eyebrow">
                Portfolio 2.0
            </div>


            <h1>
                Ayoub MNINA
            </h1>


            <p class="role">
                Data Science & Analytics Engineer
                <span>·</span>
            </p>


            <div class="message">

                <h2>
                    Loading...
                </h2>

                <p>
                    I'm currently rebuilding this website.
                </p>

            </div>


            <div class="status">
                <span class="status-dot"></span>
                Website currently being rebuilt
            </div>


            <div class="links">

                <a href="https://www.linkedin.com/in/mninaayoub/"
                   target="_blank"
                   rel="noopener noreferrer">
                    LinkedIn
                </a>

                <a href="https://github.com/Ayuub34"
                   target="_blank"
                   rel="noopener noreferrer">
                    GitHub
                </a>

                <a href="mailto:ayoub.mnina5@gmail.com">
                    Email
                </a>

            </div>

        </div>


        <div class="footer">
            © 2026 Ayoub Mnina
        </div>

    </main>

</body>
</html>
